```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dear A ❤️</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>

<canvas id="heartCanvas"></canvas>

<script>

    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    let angle = 0;

    const text = "I love you";

    function resizeCanvas() {

        // Ukuran asli canvas mengikuti ukuran layar
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

    }

    resizeCanvas();

    function drawHeart() {

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Ukuran tulisan mengikuti layar
        const fontSize = Math.min(canvas.width, canvas.height) * 0.055;

        ctx.fillStyle = "rgb(255, 51, 128)";
        ctx.font = `bold ${fontSize}px Arial`;

        // Titik tengah layar
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        // Ukuran hati mengikuti layar
        const scale = Math.min(canvas.width, canvas.height) * 0.025;

        const numSteps = 70;

        for (let i = 0; i < numSteps; i++) {

            const t =
                i * (2 * Math.PI / numSteps)
                + angle * Math.PI / 180;

            // Rumus hati
            const x =
                16 * Math.pow(Math.sin(t), 3);

            const y =
                13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t);

            const posX =
                (x * scale) + centerX;

            // Membalik koordinat Y
            const posY =
                (-y * scale) + centerY;

            ctx.fillText(text, posX, posY);
        }

        // Kecepatan gerakan
        angle += 0.15;

        requestAnimationFrame(drawHeart);
    }

    drawHeart();

    // Resize saat ukuran layar berubah
    window.addEventListener("resize", resizeCanvas);

</script>

</body>
</html>
```
